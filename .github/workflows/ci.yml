name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

# Least privilege by default; the comment job asks for more on its own.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Compiles, runs tests, writes the JaCoCo report, and fails below 80% line coverage.
      - name: Build and verify
        run: mvn -B --no-transfer-progress verify

      - name: Read line coverage
        id: coverage
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          if [ ! -f "$csv" ]; then
            echo "No JaCoCo report found"
            exit 0
          fi
          percent=$(awk -F, 'NR > 1 { missed += $8; covered += $9 }
            END { if (missed + covered > 0) printf "%.1f", 100 * covered / (missed + covered); else print "0.0" }' "$csv")
          echo "percent=$percent" >> "$GITHUB_OUTPUT"
          echo "Line coverage: $percent%" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  coverage-comment:
    needs: build
    # Fork PRs get a read-only token, so only comment on PRs from this repo.
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.build.outputs.coverage != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Post or update coverage comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          COVERAGE: ${{ needs.build.outputs.coverage }}
        with:
          script: |
            const marker = '<!-- jacoco-coverage -->';
            const body = `${marker}\n**Line coverage:** ${process.env.COVERAGE}% (minimum 80%)`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.login === 'github-actions[bot]' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
