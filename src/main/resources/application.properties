spring.application.name=retroflow

# In-memory H2 database — no persistence required between restarts.
spring.datasource.url=jdbc:h2:mem:retroflow;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Local runs use the dev profile unless another profile is activated.
spring.profiles.default=dev

spring.jpa.open-in-view=false

# The H2 console is only enabled by the dev profile (application-dev.properties).
spring.h2.console.enabled=false

# Actuator: expose only health and info over HTTP (/actuator/health, /actuator/info).
management.endpoints.web.exposure.include=health,info

# OpenAPI docs: JSON at /v3/api-docs, Swagger UI at /swagger-ui.html
